<text x="510" y="322" font-family="system-ui,sans-serif" font-size="23" fill="#182e46">Summary and synthesis</text>
<text x="510" y="358" font-family="system-ui,sans-serif" font-size="19" fill="#445b70">How do the ideas fit together?</text>
