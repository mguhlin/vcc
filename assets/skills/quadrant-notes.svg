<path d="M480 92V460M48 280H912" stroke="#8b9daf" stroke-width="2"/>
<text x="56" y="122" font-family="system-ui,sans-serif" font-size="23" fill="#182e46">Main ideas</text>
<text x="56" y="158" font-family="system-ui,sans-serif" font-size="19" fill="#445b70">Which ideas matter most?</text>
<path d="M56 186H431" stroke="#ced7e0" stroke-width="2"/>
<path d="M56 215H396" stroke="#ced7e0" stroke-width="2"/>
