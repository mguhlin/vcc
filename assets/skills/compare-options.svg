<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Decision comparison table</title><desc id="desc">Options appear in a criteria table, with must-haves, unknowns, and a small next test.</desc>
<rect width="960" height="520" fill="#dce7f2"/>
<path d="M24 68H936V496H24Z" fill="#fff" stroke="#8499b0" stroke-width="2"/>
<text x="24" y="44" font-family="Georgia,serif" font-size="30" fill="#152d48">Decision comparison table</text>
<text x="52" y="120" font-family="system-ui,sans-serif" font-size="24" fill="#152d48">What must this option do?</text>
<text x="52" y="160" font-family="system-ui,sans-serif" font-size="21" fill="#3c546c">Must-haves first. Preferences next.</text>
<text x="52" y="218" font-family="system-ui,sans-serif" font-size="21" fill="#1c528d">Criterion</text>
<text x="342" y="218" font-family="system-ui,sans-serif" font-size="21" fill="#1c528d">Option A</text>
<text x="632" y="218" font-family="system-ui,sans-serif" font-size="21" fill="#1c528d">Option B</text>
<path d="M52 236H908" stroke="#c5d1df" stroke-width="2"/>
<text x="52" y="274" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Time available</text>
<text x="342" y="274" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Evidence needed</text>
<text x="632" y="274" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Evidence needed</text>
<path d="M52 292H908" stroke="#c5d1df" stroke-width="2"/>
<text x="52" y="330" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Device access</text>
<text x="342" y="330" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Unknown</text>
<text x="632" y="330" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Unknown</text>
<path d="M52 348H908" stroke="#c5d1df" stroke-width="2"/>
<text x="52" y="386" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Small trial</text>
<text x="342" y="386" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Plan a test</text>
<text x="632" y="386" font-family="system-ui,sans-serif" font-size="21" fill="#152d48">Plan a test</text>
<path d="M52 404H908" stroke="#c5d1df" stroke-width="2"/>
<text x="52" y="465" font-family="system-ui,sans-serif" font-size="23" fill="#152d48">What unknown could change your choice?</text>
</svg>
